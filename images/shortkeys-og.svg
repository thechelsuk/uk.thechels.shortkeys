<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ShortKeys — stop typing the same thing twice</title>
  <desc id="description">A custom text expansion keyboard for iPhone and iPad. Save your words once and use them in any app.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfddff"/>
      <stop offset="1" stop-color="#d8f9e9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#202d65" flood-opacity=".18"/>
    </filter>
    <clipPath id="artwork">
      <rect x="841" y="39" width="255" height="552" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="988" cy="311" r="290" fill="url(#orb)"/>
  <circle cx="1135" cy="104" r="7" fill="#ffb454"/>
  <path d="m1122 104h26m-13-13v26" stroke="#ffb454" stroke-width="3" stroke-linecap="round"/>

  <image href="shortkeys-icon.jpg" x="66" y="54" width="54" height="54" preserveAspectRatio="xMidYMid slice"/>
  <text x="134" y="91" fill="#111a3a" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="-1">ShortKeys</text>

  <circle cx="75" cy="183" r="5" fill="#4ecba2"/>
  <text x="91" y="188" fill="#3449dc" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">TEXT EXPANSION FOR IPHONE &amp; IPAD</text>

  <text x="65" y="287" fill="#111a3a" font-family="Arial, Helvetica, sans-serif" font-size="73" font-weight="700" letter-spacing="-4">Stop typing the</text>
  <text x="65" y="373" fill="#3449dc" font-family="Arial, Helvetica, sans-serif" font-size="79" font-weight="700" letter-spacing="-4">same thing twice.</text>

  <text x="69" y="431" fill="#626b83" font-family="Arial, Helvetica, sans-serif" font-size="23">Save the words you use every day.</text>
  <text x="69" y="464" fill="#626b83" font-family="Arial, Helvetica, sans-serif" font-size="23">Expand them in any app with a few taps.</text>

  <rect x="66" y="512" width="228" height="58" rx="15" fill="#111a3a"/>
  <text x="94" y="535" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">Download on the</text>
  <text x="94" y="557" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">App Store</text>
  <path d="M77 524c3-4 9-5 13-2-4 3-4 8-1 11 2 3 5 4 5 7 0 5-4 8-7 8-3 0-5-2-8-2s-5 2-8 2c-5 0-10-7-10-14 0-8 5-13 11-13 2 0 4 1 5 3Zm4-6c1-4 5-7 8-7 0 4-3 8-7 8h-1Z" transform="translate(40 270) scale(.5)" fill="#fff"/>

  <g filter="url(#shadow)" transform="rotate(3 982.5 315)">
    <rect x="828" y="26" width="281" height="578" rx="35" fill="#fff"/>
    <image href="shortkeys-intro.webp" x="841" y="39" width="255" height="552" preserveAspectRatio="xMidYMid slice" clip-path="url(#artwork)"/>
  </g>
</svg>
